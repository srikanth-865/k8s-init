apiVersion: apps/v1
kind: Deployment
metadata:
 name: mysql
 namespace: roboshop
 labels:
    project: roboshop
    tier: db
    component: mysql
spec:
 replicas: 1
 selector:
  matchLabels:
    project: roboshop
    tier: db
    component: mysql
    #Pod
 template:
   metadata:
    name: mysql
    namespace: roboshop
    labels:
      project: roboshop
      tier: db
      component: mysql
 spec:
    serviceAccountName: roboshop-mysql
    initContainers: #init container
     - name: secret-reader #name 
       image: amazon/aws-cli #AWS official image
       command:
        - sh
        - -c
        - |  
            aws secretsmanager get-secret-value --secret-id \
            roboshop/mysql_root_password --query SecretString \
            --output text | jq -r '.mysql_root_password' > /secrets/mysql-secret.txt
             echo "Secret fetched successfully"
            cat /secrets/mysql-secret.txt # just for testing, we should not do this 
       volumeMounts:
       - name: mysql-secret
         mountPath: /secrets     
   containers:
     - name: mysql
       image: srikanth865/mysql:5.0.0
       volumeMounts:
       - name: mysql-secret
         mountPath: /secrets
   volumes:
      - name: mysql-secret
        emptyDir: {}
---

apiVersion: v1
kind: Service
metadata: 
 name: mysql
 namespace: roboshop
 labels:
    project: roboshop
    tier: db
    component: mysql
spec:
 selector:
    project: roboshop
    tier: db
    component: mysql
 ports: 
  - protocol: TCP
    port: 3306 
    targetPort: 3306





 